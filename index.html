<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#F6F7F5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0F1311" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Finanzas" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<title>Mis Finanzas</title>
<!-- CSS critico inline: hasta que los estilos reales cargan solo se ve el splash (nunca HTML sin estilos). -->
<style>
  html { background: #F6F7F5; }
  @media (prefers-color-scheme: dark) { html { background: #0F1311; }  }
  html:not(.ready) #app, html:not(.ready) #modalRoot { display: none; }
  #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 500 1rem system-ui, sans-serif; color: CanvasText; letter-spacing: -0.005em; }
  html.ready #splash { display: none; }
</style>
<link rel="stylesheet" href="tailwind.css" />
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Fuente no bloqueante: si no llega, se usa la del sistema. -->
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="vendor/chart.umd.min.js" defer></script>
<script src="vendor/sweetalert2.all.min.js" defer></script>
</head>
<body class="bg-bg text-ink min-h-screen">
<div id="splash">Mis finanzas</div>
<div id="styleProbe" class="fixed" hidden></div>
<div id="app" class="min-h-screen flex flex-col">

  <header class="flex items-center justify-between md:justify-start gap-3 md:gap-6 px-5 sm:px-8 h-14 bg-bg border-b border-line sticky top-0 z-20">
    <div class="font-semibold text-base tracking-tight whitespace-nowrap">Mis finanzas</div>
    <nav id="tabs" class="hidden md:flex gap-1 flex-1 h-full items-stretch" hidden>
      <button data-view="dashboard" class="tab-btn px-2.5 text-sm font-medium text-mute whitespace-nowrap hover:text-ink">Inicio</button>
      <button data-view="diario" class="tab-btn px-2.5 text-sm font-medium text-mute whitespace-nowrap hover:text-ink">Diario</button>
      <button data-view="presupuesto" class="tab-btn px-2.5 text-sm font-medium text-mute whitespace-nowrap hover:text-ink">Presupuesto</button>
      <button data-view="total" class="tab-btn px-2.5 text-sm font-medium text-mute whitespace-nowrap hover:text-ink">Total</button>
      <button data-view="graficas" class="tab-btn px-2.5 text-sm font-medium text-mute whitespace-nowrap hover:text-ink">Gráficas</button>
      <button data-view="config" class="tab-btn px-2.5 text-sm font-medium text-mute whitespace-nowrap hover:text-ink">Ajustes</button>
    </nav>
    <div class="text-xs text-mute truncate min-w-0 ml-auto" id="syncStatus" hidden></div>
  </header>

  <main id="signedOutView" class="flex-1 flex items-center px-5 sm:px-8 py-12">
    <div class="max-w-md mx-auto w-full">
      <h1 class="text-4xl sm:text-5xl font-light tracking-tight leading-[1.05]">Tu dinero,<br />en tu Drive.</h1>
      <p class="text-mute mt-6 leading-relaxed">Los datos se guardan en tu propio Google Drive. Nadie más tiene acceso a ellos.</p>
      <button id="signInBtn" class="mt-8 bg-accent text-surface px-6 py-3 rounded-full font-medium cursor-pointer hover:opacity-90 transition-opacity disabled:opacity-60">Conectar con Google Drive</button>
      <p id="signInError" class="text-neg text-sm mt-4" hidden></p>
      <p class="text-xs text-mute mt-8 leading-relaxed">La primera vez se crea el archivo <code>finanzas-data.json</code> en tu Drive con tu historial ya migrado.</p>
    </div>
  </main>

  <main id="appView" class="flex-1 px-5 sm:px-8 py-8 pb-28 md:pb-10 max-w-3xl w-full mx-auto" hidden>
    <h1 id="viewTitle" class="sr-only" tabindex="-1" aria-live="polite"></h1>
    <section id="view-dashboard" class="view"></section>
    <section id="view-diario" class="view" hidden></section>
    <section id="view-presupuesto" class="view" hidden></section>
    <section id="view-total" class="view" hidden></section>
    <section id="view-graficas" class="view" hidden></section>
    <section id="view-config" class="view" hidden></section>
  </main>

  <nav id="mobileTabs" class="md:hidden fixed bottom-0 inset-x-0 z-20 bg-bg/95 backdrop-blur border-t border-line grid grid-cols-6 pb-[env(safe-area-inset-bottom)]" hidden>
    <button data-view="dashboard" class="tab-btn py-3.5 text-[11px] font-medium text-mute">Inicio</button>
    <button data-view="diario" class="tab-btn py-3.5 text-[11px] font-medium text-mute">Diario</button>
    <button data-view="presupuesto" class="tab-btn py-3.5 text-[11px] font-medium text-mute">Presup.</button>
    <button data-view="total" class="tab-btn py-3.5 text-[11px] font-medium text-mute">Total</button>
    <button data-view="graficas" class="tab-btn py-3.5 text-[11px] font-medium text-mute">Gráficas</button>
    <button data-view="config" class="tab-btn py-3.5 text-[11px] font-medium text-mute">Ajustes</button>
  </nav>

</div>

<div id="modalRoot"></div>

<script>
  // Muestra la app solo cuando tailwind.css + style.css ya aplicaron (o tras 4 s, para no quedar en blanco).
  (function () {
    var root = document.documentElement, t0 = Date.now();
    function styled() {
      // --bg viene de style.css y "position: fixed" de tailwind.css: si ambos aplican, los estilos cargaron.
      return getComputedStyle(root).getPropertyValue("--bg").trim() !== "" && getComputedStyle(document.getElementById("styleProbe")).position === "fixed";
    }
    function tick() {
      if (styled() || Date.now() - t0 > 4000) root.classList.add("ready");
      else requestAnimationFrame(tick);
    }
    tick();
  })();
</script>
<script type="module" src="app.js"></script>
</body>
</html>

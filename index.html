<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0f172a" />
<title>Mis Finanzas</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen [color-scheme:dark]">
<div id="app" class="min-h-screen flex flex-col">

  <header class="flex items-center gap-4 px-4 py-2.5 bg-slate-800 border-b border-slate-700 sticky top-0 z-20 flex-wrap">
    <div class="font-bold text-base whitespace-nowrap">💰 Mis Finanzas</div>
    <nav id="tabs" class="hidden sm:flex gap-1 overflow-x-auto flex-1 no-scrollbar" hidden>
      <button data-view="dashboard" class="tab-btn px-3 py-2 rounded-lg font-medium text-slate-300 whitespace-nowrap hover:bg-slate-700">Inicio</button>
      <button data-view="diario" class="tab-btn px-3 py-2 rounded-lg font-medium text-slate-300 whitespace-nowrap hover:bg-slate-700">Diario</button>
      <button data-view="presupuesto" class="tab-btn px-3 py-2 rounded-lg font-medium text-slate-300 whitespace-nowrap hover:bg-slate-700">Presupuesto</button>
      <button data-view="total" class="tab-btn px-3 py-2 rounded-lg font-medium text-slate-300 whitespace-nowrap hover:bg-slate-700">Total</button>
      <button data-view="graficas" class="tab-btn px-3 py-2 rounded-lg font-medium text-slate-300 whitespace-nowrap hover:bg-slate-700">Gráficas</button>
      <button data-view="config" class="tab-btn px-3 py-2 rounded-lg font-medium text-slate-300 whitespace-nowrap hover:bg-slate-700">Config</button>
    </nav>
    <div class="text-xs text-slate-400 whitespace-nowrap ml-auto sm:ml-0" id="syncStatus" hidden></div>
  </header>

  <main id="signedOutView" class="flex-1 flex items-center justify-center p-6">
    <div class="max-w-sm text-center bg-slate-800 border border-slate-700 rounded-xl p-8 shadow-sm">
      <h1 class="text-xl font-bold mb-3">Mis Finanzas</h1>
      <p class="text-slate-300">Tus datos se guardan en tu propio Google Drive. Nadie más tiene acceso a ellos.</p>
      <button id="signInBtn" class="mt-5 border border-blue-600 bg-blue-600 text-white px-5 py-3 rounded-lg font-medium cursor-pointer hover:bg-blue-500 transition-colors text-base">Conectar con Google Drive</button>
      <p id="signInError" class="text-red-400 text-sm mt-3" hidden></p>
      <p class="text-xs text-slate-500 mt-5">Si es la primera vez, se creará un archivo <code>finanzas-data.json</code> en tu Drive con tu historial ya migrado.</p>
    </div>
  </main>

  <main id="appView" class="flex-1 p-4 pb-20 sm:pb-4 max-w-5xl w-full mx-auto" hidden>
    <section id="view-dashboard" class="view"></section>
    <section id="view-diario" class="view" hidden></section>
    <section id="view-presupuesto" class="view" hidden></section>
    <section id="view-total" class="view" hidden></section>
    <section id="view-graficas" class="view" hidden></section>
    <section id="view-config" class="view" hidden></section>
  </main>

  <nav id="mobileTabs" class="sm:hidden fixed bottom-0 inset-x-0 z-20 bg-slate-800 border-t border-slate-700 grid grid-cols-6" hidden>
    <button data-view="dashboard" class="tab-btn flex flex-col items-center justify-center gap-0.5 py-2 text-slate-400">
      <span class="text-lg leading-none">🏠</span><span class="text-[10px] font-medium leading-none">Inicio</span>
    </button>
    <button data-view="diario" class="tab-btn flex flex-col items-center justify-center gap-0.5 py-2 text-slate-400">
      <span class="text-lg leading-none">📋</span><span class="text-[10px] font-medium leading-none">Diario</span>
    </button>
    <button data-view="presupuesto" class="tab-btn flex flex-col items-center justify-center gap-0.5 py-2 text-slate-400">
      <span class="text-lg leading-none">💰</span><span class="text-[10px] font-medium leading-none">Presup.</span>
    </button>
    <button data-view="total" class="tab-btn flex flex-col items-center justify-center gap-0.5 py-2 text-slate-400">
      <span class="text-lg leading-none">🧮</span><span class="text-[10px] font-medium leading-none">Total</span>
    </button>
    <button data-view="graficas" class="tab-btn flex flex-col items-center justify-center gap-0.5 py-2 text-slate-400">
      <span class="text-lg leading-none">📈</span><span class="text-[10px] font-medium leading-none">Gráficas</span>
    </button>
    <button data-view="config" class="tab-btn flex flex-col items-center justify-center gap-0.5 py-2 text-slate-400">
      <span class="text-lg leading-none">⚙️</span><span class="text-[10px] font-medium leading-none">Config</span>
    </button>
  </nav>

</div>

<div id="modalRoot"></div>

<script type="module" src="app.js"></script>
</body>
</html>
